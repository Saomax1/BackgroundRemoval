[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cutout"
version = "0.1.0"
description = "Offline, GPU-accelerated background removal for people and anime characters"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pillow>=10.3",
]

[project.optional-dependencies]
# NVIDIA build (what the Windows installer ships). The [cuda,cudnn] extras pull the
# CUDA 12 runtime + cuDNN as pip wheels so the user never installs the CUDA toolkit.
gpu = ["onnxruntime-gpu[cuda,cudnn]>=1.21"]
# CPU-only fallback, used by CI and for development machines without NVIDIA.
cpu = ["onnxruntime>=1.21"]
# Desktop editor window (src/cutout/ui).
ui = ["PySide6>=6.7"]
dev = ["pytest>=8", "onnx>=1.16"]
# Windows installer build: packaging/cutout.spec + packaging/cutout.iss (see packaging/README.md).
build = ["pyinstaller>=6.10"]

[project.scripts]
cutout = "cutout.cli:main"

[project.gui-scripts]
cutout-gui = "cutout.ui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The helper that swaps files after the app closes (cutout.update.client.launch_apply).
"cutout.update" = ["*.ps1"]
# The face detector behind Head only (YuNet, 230 KB, MIT licence): part of the app, not a model pack.
"cutout.core" = ["data/*.onnx", "data/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
