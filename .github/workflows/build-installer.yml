name: windows installer

# Builds Cutout: PyInstaller app + CUDA/cuDNN DLLs + AI models, split into update packs
# (packaging/make_release.py), plus a small Cutout-Setup-<version>.exe that downloads the
# GPU runtime and models on first start. On a clean runner it installs Setup, finishes the
# install and applies an update the way the app does, then runs real cutouts.
# Every push to main publishes the result as a GitHub release, which is where the app's
# Help > Check for Updates looks. Pull requests only build and test.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/**"
      - "scripts/**"
      - "src/cutout/core/models.py"
      - "src/cutout/core/prompt_segmenter.py"
      - "src/cutout/core/runtime.py"
      - "pyproject.toml"
      - ".github/workflows/build-installer.yml"

concurrency:
  group: installer-${{ github.ref }}
  # Never cancel a main build half-way through publishing its release.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHON_VERSION: "3.12"
  # Bump to force a model rebuild without changing any model file.
  MODELS_CACHE_SALT: "v1"

jobs:
  models:
    # Downloads ready-made ONNX files and exports the PyTorch-only ones. Slow (exports
    # run on CPU), so the result is cached and only rebuilt when the recipe changes.
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v4
      - id: key
        run: echo "key=models-${{ env.MODELS_CACHE_SALT }}-${{ hashFiles('src/cutout/core/models.py', 'scripts/export_birefnet_onnx.py', 'scripts/onnx_deform_conv.py', 'scripts/build_models.py', 'scripts/fetch_models.py', 'packaging/requirements-export.txt') }}" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: build/models
          key: ${{ steps.key.outputs.key }}
          enableCrossOsArchive: true
          lookup-only: true
      - name: Free disk space
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: Add swap for the 2048 px export
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 16G /swapfile-export && sudo chmod 600 /swapfile-export
          sudo mkswap /swapfile-export && sudo swapon /swapfile-export && free -h
      - uses: actions/setup-python@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install export toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        run: pip install -e ".[cpu]" -r packaging/requirements-export.txt
      - name: Check the ONNX deformable-conv replacement against torchvision
        if: steps.cache.outputs.cache-hit != 'true'
        run: python scripts/onnx_deform_conv.py
      - name: Build and check models
        if: steps.cache.outputs.cache-hit != 'true'
        run: python scripts/build_models.py --models-dir build/models
      - name: Show manifest
        if: always() && steps.cache.outputs.cache-hit != 'true'
        run: cat build/models/manifest.json || true
      - uses: actions/cache/save@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: build/models
          key: ${{ steps.key.outputs.key }}
          enableCrossOsArchive: true

  prompt-models:
    # Click-to-select (SAM 2.1). Separate job and cache so a failure here only leaves
    # click-to-select out of the installer instead of blocking it.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v4
      - id: key
        run: echo "key=prompt-models-${{ env.MODELS_CACHE_SALT }}-${{ hashFiles('src/cutout/core/models.py', 'src/cutout/core/prompt_segmenter.py', 'scripts/export_sam2_onnx.py', 'scripts/build_prompt_models.py') }}" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: build/prompt-models
          key: ${{ steps.key.outputs.key }}
          enableCrossOsArchive: true
          lookup-only: true
      - uses: actions/setup-python@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install SAM 2 export toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          SAM2_BUILD_CUDA: "0"
        run: |
          pip install -e ".[cpu]" onnx huggingface_hub torch==2.5.1 torchvision==0.20.1 --extra-index-url https://download.pytorch.org/whl/cpu
          pip install --no-build-isolation "git+https://github.com/facebookresearch/sam2.git"
      - name: Export and check click-to-select model
        if: steps.cache.outputs.cache-hit != 'true'
        run: python scripts/build_prompt_models.py --models-dir build/prompt-models
      - uses: actions/cache/save@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: build/prompt-models
          key: ${{ steps.key.outputs.key }}
          enableCrossOsArchive: true

  installer:
    needs: [models, prompt-models]
    # Ship without click-to-select rather than not at all if only the SAM export failed.
    if: ${{ !cancelled() && needs.models.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 150
    permissions:
      contents: write  # create the release
    env:
      GH_TOKEN: ${{ github.token }}
      PUBLISH: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Set the version
        run: python packaging/set_version.py ${{ github.run_number }}
      - name: Install app with GPU runtime and build tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gpu,ui,build,dev]"
      - name: Unit tests
        run: python -m pytest -q

      - name: Freeze with PyInstaller
        run: pyinstaller packaging/cutout.spec --noconfirm --distpath dist --workpath build/pyinstaller

      - uses: actions/cache/restore@v4
        with:
          path: build/models
          key: ${{ needs.models.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Stage models
        run: python packaging/stage_models.py build/models dist/Cutout/models

      - uses: actions/cache/restore@v4
        if: needs.prompt-models.result == 'success'
        with:
          path: build/prompt-models
          key: ${{ needs.prompt-models.outputs.key }}
          enableCrossOsArchive: true
      - name: Stage click-to-select model
        run: |
          $files = Get-ChildItem build/prompt-models/*.onnx -ErrorAction SilentlyContinue
          if (-not $files) { "::warning::No click-to-select model; this build ships without it."; exit 0 }
          $files | ForEach-Object { Copy-Item $_ dist/Cutout/models/; "staged {0} ({1:N0} MB)" -f $_.Name, ($_.Length / 1MB) }

      - name: Report app size
        run: |
          $mb = (Get-ChildItem dist/Cutout -Recurse -File | Measure-Object Length -Sum).Sum / 1MB
          "dist/Cutout: {0:N0} MB" -f $mb

      - name: Previous release (unchanged parts keep its downloads)
        run: |
          gh release download --repo ${{ github.repository }} --pattern cutout-release.json --dir build/prev
          if ($LASTEXITCODE) { "no earlier release found: every part is uploaded" }
          exit 0
      - name: Release notes
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          if ($env:PUBLISH -eq 'true') {
            gh api repos/${{ github.repository }}/releases/generate-notes -f tag_name="v$env:VERSION" -f target_commitish="${{ github.sha }}" --jq .body > build/notes.md
            if ($LASTEXITCODE) { "Cutout $env:VERSION" > build/notes.md }
          } else {
            "Test build of ${{ github.ref_name }} (not published)." > build/notes.md
          }
          Get-Content build/notes.md
          exit 0
      - name: Make update packs and Setup input
        run: |
          $prev = if (Test-Path build/prev/cutout-release.json) { @("--previous", "build/prev/cutout-release.json") } else { @() }
          python packaging/make_release.py dist/Cutout dist/release --version $env:VERSION `
            --base-url "https://github.com/${{ github.repository }}/releases/download/v$env:VERSION" `
            --notes-file build/notes.md --setup-dir dist/setup @prev
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Install Inno Setup
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $v = [version](Get-Item $iscc).VersionInfo.ProductVersion.Split(' ')[0]
          "Inno Setup $v"
          if ($v -lt [version]"6.5.2") { choco upgrade innosetup -y --no-progress }
          "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Build Setup.exe
        run: |
          & $env:ISCC /Qp "/DAppVersion=$env:VERSION" "/DFirstRunGB=$env:FIRST_RUN_GB" packaging\cutout.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $setup = Get-ChildItem dist/installer/*.exe | Select-Object -First 1
          "{0}: {1:N0} MB" -f $setup.Name, ($setup.Length / 1MB)
          if ($setup.Length -gt 2.0e9) { throw "Setup.exe is over GitHub's 2 GB release file limit" }
          "SETUP=$($setup.FullName)" >> $env:GITHUB_ENV

      - name: Smoke test - install, finish setup, cut out, update
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "CutoutInstall"
          $cli = Join-Path $dir "cutout-cli.exe"
          $result = Join-Path $env:LOCALAPPDATA "Cutout\updates\last-result.json"
          function Wait-Update {
            for ($i = 0; $i -lt 600 -and -not (Test-Path $result); $i++) { Start-Sleep -Milliseconds 500 }
            if (-not (Test-Path $result)) { throw "the update helper never finished" }
            $r = Get-Content $result -Raw | ConvertFrom-Json
            if (-not $r.ok) { Get-Content $r.log -ErrorAction SilentlyContinue; throw "update failed: $($r.message)" }
            Remove-Item $result
          }

          $p = Start-Process $env:SETUP -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=`"$dir`"","/LOG=`"$env:RUNNER_TEMP\setup.log`"" -Wait -PassThru
          if ($p.ExitCode) { Get-Content "$env:RUNNER_TEMP\setup.log" -Tail 40; throw "setup exited $($p.ExitCode)" }
          foreach ($f in "Cutout.exe", "cutout-cli.exe", "release.json") {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "missing $f after install" }
          }

          # Parts new in this build come from dist/release; parts reused from an earlier
          # release are downloaded from GitHub and SHA-256 checked, so nothing publishes
          # unless every file the manifest points at really matches it.
          "--- first start: fetch the GPU runtime and models"
          & $cli --version
          & $cli --update --manifest (Join-Path $dir "release.json") --from-dir dist/release
          if ($LASTEXITCODE) { throw "finishing the install failed" }
          Wait-Update
          $v = & $cli --version | Out-String
          $v
          if ($v -match "missing:") { throw "parts still missing after finishing the install" }

          $diag = & $cli --diagnose | Out-String
          $diag
          # No GPU on the runner, but every CUDA/cuDNN DLL must still resolve from the install.
          if ($diag -notmatch "CUDA provider DLL loads: yes") { throw "CUDA DLLs are not loadable from the install" }
          & $cli --list-models
          if ($LASTEXITCODE) { throw "--list-models failed" }

          python -c "import numpy as np; from PIL import Image; y,x=np.mgrid[0:601,0:433]; a=np.stack([x%255,y%255,(x*y)%255],-1).astype('uint8'); a[150:450,120:310]=(220,170,140); Image.fromarray(a).save(r'$env:RUNNER_TEMP\sample.png')"
          foreach ($subject in "person", "anime") {
            $out = Join-Path $env:RUNNER_TEMP "out_$subject.png"
            & $cli "$env:RUNNER_TEMP\sample.png" --subject $subject --device cpu -o $out
            if ($LASTEXITCODE) { throw "$subject cutout failed" }
            python -c "from PIL import Image; im=Image.open(r'$out'); assert im.mode=='RGBA' and im.size==(433,601), (im.mode, im.size); print('ok', im.size)"
            if ($LASTEXITCODE) { throw "$subject output is wrong" }
          }

          "--- update: a newer version where only the app part changed"
          "ci" | Set-Content dist/Cutout/_internal/cutout/ci-update-marker.txt
          python packaging/make_release.py dist/Cutout dist/release-next --version "$env:VERSION.1" `
            --base-url "https://example.invalid/next" --previous dist/release/cutout-release.json --no-check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $check = & $cli --check-updates --manifest dist/release-next/cutout-release.json | Out-String
          $check
          if ($check -notmatch "in 1 part") { throw "expected only the app part to change" }
          & $cli --update --manifest dist/release-next/cutout-release.json --from-dir dist/release-next
          if ($LASTEXITCODE) { throw "update failed to start" }
          Wait-Update
          if (-not (Test-Path (Join-Path $dir "_internal/cutout/ci-update-marker.txt"))) { throw "update did not install the new file" }
          $v = & $cli --version | Out-String
          $v
          if ($v -notmatch "installed release $([regex]::Escape("$env:VERSION.1"))") { throw "version not updated" }
          & $cli "$env:RUNNER_TEMP\sample.png" --subject anime --device cpu -o "$env:RUNNER_TEMP\after_update.png"
          if ($LASTEXITCODE) { throw "cutout after update failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: Cutout-Setup
          path: dist/installer/*.exe
          compression-level: 0
          retention-days: 14

      - name: Publish GitHub release
        if: env.PUBLISH == 'true'
        run: |
          $tag = "v$env:VERSION"
          $repo = "${{ github.repository }}"
          $files = @(Get-Content dist/release/upload.txt | Where-Object { $_ -and $_ -notlike '*cutout-release.json' })
          # Same Setup under a fixed name, so the README can link straight to
          # releases/latest/download/Cutout-Setup.exe. The updater reads only the manifest.
          New-Item -ItemType Directory -Force dist/latest | Out-Null
          Copy-Item $env:SETUP dist/latest/Cutout-Setup.exe
          gh release create $tag --repo $repo --draft --title "Cutout $env:VERSION" --notes-file build/notes.md --target ${{ github.sha }} $env:SETUP dist/latest/Cutout-Setup.exe @files
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # The manifest goes up last and the release only becomes visible once every file
          # is there, so the app never sees a half-uploaded release.
          gh release upload $tag dist/release/cutout-release.json --repo $repo
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          gh release edit $tag --repo $repo --draft=false --latest
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "published https://github.com/$repo/releases/tag/$tag"
